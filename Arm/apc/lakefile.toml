name = "apc"
defaultTargets = ["Apc"]

# our own interface and middle-layer files, taken from the repo root (unchanged)
[[lean_lib]]
name = "Spec"
srcDir = "../.."
globs = ["Spec.Code", "Spec.ArrCode", "Spec.Encode", "Spec.Tree", "Spec.Machines", "Spec.Top"]

[[lean_lib]]
name = "Compiler"
srcDir = "../.."
globs = ["Compiler.Iface", "Compiler.Logic", "Compiler.Exp", "Compiler.Stmt", "Compiler.Mem", "Compiler.Arr",
  "Compiler.BLang", "Compiler.CLang", "Compiler.Frame", "Compiler.BExp", "Compiler.BStmt", "Compiler.Call",
  "Compiler.CStmt", "Compiler.CProg", "Compiler.Wide", "Compiler.MOp",
  "Compiler.Opt.IR", "Compiler.Opt.Alloc", "Compiler.Opt.Live", "Compiler.Opt.SR", "Compiler.Opt.Color", "Compiler.Opt.Fn", "Compiler.Opt.Sel",
  "Compiler.Opt.Exp", "Compiler.Opt.Stmt", "Compiler.Opt.Arr", "Compiler.Opt.BSel", "Compiler.Opt.BFn", "Compiler.Opt.Lower",
  "Compiler.Opt.Flow", "Compiler.Opt.Hoist", "Compiler.Opt.Peep"]
# Lean 4.34: `Compiler/Opt/Flow.lean` (written on 4.29) needs the old isDefEq transparency (S8b; no source edit)
moreLeanArgs = ["-Dweak.backward.isDefEq.respectTransparency=false"]

# `Apc.Wide`, `Apc.Opt`, `Apc.Emit2` and the staged `Apc.Src.Search` are left out (2026-11-20): `Compiler.Wide` gained
# `WOp.mop` / law `w_mop` (mul/divu/remu/div/rem) and `Apc.Wide` has no ARM proof of it yet (see NOTES.md, S8b).
[[lean_lib]]
name = "Apc"
globs = ["Apc.Small", "Apc.Flags", "Apc.Sym", "Apc.Mach", "Apc.Mem8", "Apc.Frame", "Apc.Stack", "Apc.Agree",
  "Apc.AgreeAll", "Apc.WideDec", "Apc.Msort", "Apc.Call", "Apc.Calls", "Apc.Emit", "Apc.Axioms",
  "Apc.Src.Loop", "Apc.Src.ArrEx", "Apc.Src.SortIns", "Apc.Src.Arr2Code", "Apc.Src.Arr2Src", "Apc.Src.SortMergeList",
  "Apc.Src.SortMergeSrc", "Apc.Src.MsortB", "Apc.Src.ToM", "Apc.Src.CallsSrc", "Apc.Src.CallExamples",
  "Apc.Src.TreeEval", "Apc.Src.Implements1Ex", "Apc.Src.Crc"]

# google-deepmind/code-verification at b0f729a (Apache-2.0), cloned next to the repo, NOT vendored:
# /home/user/deps/code-verification (see Arm/apc/check.sh)
[[require]]
name = "arm64"
path = "../../../deps/code-verification/arm64-semantics/Arm64"

# per-instruction-form step lemmas and the rv2arm block proof on DeepMind's model (interim target; Blocks/NOTES.md)
[[lean_lib]]
name = "Blocks"
globs = ["Blocks.+"]

# J (the nano V2 jump-machine semantics, pure Lean): CallProbe.step, the source side of BlockOK
[[lean_lib]]
name = "Nano"
srcDir = "../.."
globs = ["Nano.V2.Gen", "Nano.V2.Lang", "Nano.V2.Sem", "Nano.V2Self.C.Base", "Nano.V2Self.C.Gen", "Nano.V2Self.Prelude", "Nano.V2Self.Proof.Gen.BufL", "Nano.V2Self.Proof.Gen.Fixup", "Nano.V2Self.Proof.Gen.GenAll", "Nano.V2Self.Proof.Gen.GenRef", "Nano.V2Self.Proof.Gen.GenTop", "Nano.V2Self.Proof.Gen.GenWidth", "Nano.V2Self.Proof.Lex.Lex2Spec", "Nano.V2Self.Proof.Machine.A64Sem", "Nano.V2Self.Proof.Machine.ArmEnc", "Nano.V2Self.Proof.Machine.Bridge", "Nano.V2Self.Proof.Machine.Call", "Nano.V2Self.Proof.Machine.CallA", "Nano.V2Self.Proof.Machine.CallExact", "Nano.V2Self.Proof.Machine.EVX", "Nano.V2Self.Proof.Machine.EVXC", "Nano.V2Self.Proof.Machine.EVXF", "Nano.V2Self.Proof.Machine.EVXL", "Nano.V2Self.Proof.Machine.EVXP", "Nano.V2Self.Proof.Machine.EVXT", "Nano.V2Self.Proof.Machine.Expr", "Nano.V2Self.Proof.Machine.ExprBridge", "Nano.V2Self.Proof.Machine.ExprEV", "Nano.V2Self.Proof.Machine.ExprExact", "Nano.V2Self.Proof.Machine.Heap", "Nano.V2Self.Proof.Machine.HeapEV", "Nano.V2Self.Proof.Machine.JLay", "Nano.V2Self.Proof.Machine.Loop", "Nano.V2Self.Proof.Machine.MachExact", "Nano.V2Self.Proof.Machine.NdCG", "Nano.V2Self.Proof.Machine.NdCGm", "Nano.V2Self.Proof.Machine.NdCGt", "Nano.V2Self.Proof.Machine.NdCGv", "Nano.V2Self.Proof.Machine.NdCGw", "Nano.V2Self.Proof.Machine.NdDef", "Nano.V2Self.Proof.Machine.NdProg", "Nano.V2Self.Proof.Machine.NdProgW", "Nano.V2Self.Proof.Machine.NdRun", "Nano.V2Self.Proof.Machine.NdSem", "Nano.V2Self.Proof.Machine.NdTop", "Nano.V2Self.Proof.Machine.NdTop2", "Nano.V2Self.Proof.Machine.NdWidth", "Nano.V2Self.Proof.Machine.NdWidthB", "Nano.V2Self.Proof.Machine.NoW", "Nano.V2Self.Proof.Machine.RvEnc", "Nano.V2Self.Proof.Machine.StartCode", "Nano.V2Self.Proof.Machine.Target", "Nano.V2Self.Proof.Machine.Templates", "Nano.V2Self.Proof.Parser.ParSpec"]
moreLeanArgs = ["-Dweak.backward.isDefEq.respectTransparency=false"]
