name = "apc"
defaultTargets = ["Apc"]

# our own interface and middle-layer files, taken from the repo root (unchanged)
[[lean_lib]]
name = "Spec"
srcDir = "../.."
globs = ["Spec.Code", "Spec.ArrCode", "Spec.Encode", "Spec.Tree", "Spec.Machines", "Spec.Top", "Spec.Alloc", "Spec.Loader", "Spec.ARM.DeepMind"]

[[lean_lib]]
name = "Compiler"
srcDir = "../.."
globs = ["Nano.Base.Compiler.Iface", "Nano.Base.Compiler.Logic", "Nano.Base.Compiler.Exp", "Nano.Base.Compiler.Stmt", "Nano.Base.Compiler.Mem", "Nano.Base.Compiler.Arr",
  "Nano.Base.Compiler.BLang", "Nano.Base.Compiler.CLang", "Nano.Base.Compiler.Frame", "Nano.Base.Compiler.BExp", "Nano.Base.Compiler.BStmt", "Nano.Base.Compiler.Call",
  "Nano.Base.Compiler.CStmt", "Nano.Base.Compiler.CProg", "Nano.Base.Compiler.Wide", "Nano.Base.Compiler.MOp", "Nano.Base.Compiler.AllocSpec",
  "Nano.Base.Compiler.Opt.IR", "Nano.Base.Compiler.Opt.Alloc", "Nano.Base.Compiler.Opt.Live", "Nano.Base.Compiler.Opt.SR", "Nano.Base.Compiler.Opt.Color", "Nano.Base.Compiler.Opt.Fn", "Nano.Base.Compiler.Opt.Sel",
  "Nano.Base.Compiler.Opt.Exp", "Nano.Base.Compiler.Opt.Stmt", "Nano.Base.Compiler.Opt.Arr", "Nano.Base.Compiler.Opt.BSel", "Nano.Base.Compiler.Opt.BFn", "Nano.Base.Compiler.Opt.Lower",
  "Nano.Base.Compiler.Opt.Flow", "Nano.Base.Compiler.Opt.Hoist", "Nano.Base.Compiler.Opt.Peep"]
# Lean 4.34: `Nano/Base/Compiler/Opt/Flow.lean` (written on 4.29) needs the old isDefEq transparency (S8b; no source edit)
moreLeanArgs = ["-Dweak.backward.isDefEq.respectTransparency=false"]

# `Apc.Wide`, `Apc.Opt`, `Apc.Emit2` and the staged `Apc.Src.Search` are left out (2026-11-20): `Nano.Base.Compiler.Wide` gained
# `WOp.mop` / law `w_mop` (mul/divu/remu/div/rem) and `Apc.Wide` has no ARM proof of it yet (see NOTES.md, S8b).
[[lean_lib]]
name = "Apc"
globs = ["Apc.Small", "Apc.Flags", "Apc.Sym", "Apc.Mach", "Apc.Mem8", "Apc.Frame", "Apc.Stack", "Apc.Agree",
  "Apc.AgreeAll", "Apc.WideDec", "Apc.Msort", "Apc.Call", "Apc.Calls", "Apc.Emit", "Apc.Axioms",
  "Apc.Src.Loop", "Apc.Src.ArrEx", "Apc.Src.SortIns", "Apc.Src.Arr2Code", "Apc.Src.Arr2Src", "Apc.Src.SortMergeList",
  "Apc.Src.SortMergeSrc", "Apc.Src.MsortB", "Apc.Src.ToM", "Apc.Src.CallsSrc", "Apc.Src.CallExamples",
  "Apc.Src.TreeEval", "Apc.Src.Implements1Ex", "Apc.Src.Crc"]

# google-deepmind/code-verification at b0f729a (Apache-2.0), cloned next to the repo, NOT vendored:
# /home/user/deps/code-verification (see Arm/apc/check.sh)
[[require]]
name = "arm64"
path = "../../../deps/code-verification/arm64-semantics/Arm64"

# per-instruction-form step lemmas and the rv2arm block proof on DeepMind's model (interim target; Blocks/NOTES.md)
[[lean_lib]]
name = "Blocks"
globs = ["Blocks.+"]

