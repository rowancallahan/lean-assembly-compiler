name = "apc"
defaultTargets = ["Apc"]

# our own interface and middle-layer files, taken from the repo root (unchanged)
[[lean_lib]]
name = "Spec"
srcDir = "../.."
globs = ["Spec.Code", "Spec.ArrCode", "Spec.Encode", "Spec.Tree"]

[[lean_lib]]
name = "Compiler"
srcDir = "../.."
globs = ["Compiler.Iface", "Compiler.Logic", "Compiler.Exp", "Compiler.Stmt", "Compiler.Mem", "Compiler.Arr",
  "Compiler.BLang", "Compiler.CLang", "Compiler.Frame", "Compiler.BExp", "Compiler.BStmt", "Compiler.Call",
  "Compiler.CStmt", "Compiler.CProg", "Compiler.Wide", "Compiler.MOp",
  "Compiler.Opt.IR", "Compiler.Opt.Alloc", "Compiler.Opt.Live", "Compiler.Opt.SR", "Compiler.Opt.Color", "Compiler.Opt.Fn", "Compiler.Opt.Sel",
  "Compiler.Opt.Exp", "Compiler.Opt.Stmt", "Compiler.Opt.Arr", "Compiler.Opt.BSel", "Compiler.Opt.BFn", "Compiler.Opt.Lower",
  "Compiler.Opt.Flow", "Compiler.Opt.Hoist", "Compiler.Opt.Peep"]
# Lean 4.34: `Compiler/Opt/Flow.lean` (written on 4.29) needs the old isDefEq transparency (S8b; no source edit)
moreLeanArgs = ["-Dweak.backward.isDefEq.respectTransparency=false"]

# `Apc.Wide`, `Apc.Opt`, `Apc.Emit2` and the staged `Apc.Src.Search` are left out (2026-11-20): `Compiler.Wide` gained
# `WOp.mop` / law `w_mop` (mul/divu/remu/div/rem) and `Apc.Wide` has no ARM proof of it yet (see NOTES.md, S8b).
[[lean_lib]]
name = "Apc"
globs = ["Apc.Small", "Apc.Flags", "Apc.Sym", "Apc.Mach", "Apc.Mem8", "Apc.Frame", "Apc.Stack", "Apc.Agree",
  "Apc.AgreeAll", "Apc.WideDec", "Apc.Msort", "Apc.Call", "Apc.Calls", "Apc.Emit", "Apc.Axioms",
  "Apc.Src.Loop", "Apc.Src.ArrEx", "Apc.Src.SortIns", "Apc.Src.Arr2Code", "Apc.Src.Arr2Src", "Apc.Src.SortMergeList",
  "Apc.Src.SortMergeSrc", "Apc.Src.MsortB", "Apc.Src.ToM", "Apc.Src.CallsSrc", "Apc.Src.CallExamples",
  "Apc.Src.TreeEval", "Apc.Src.Implements1Ex", "Apc.Src.Crc"]

# google-deepmind/code-verification at b0f729a (Apache-2.0), cloned next to the repo, NOT vendored:
# /home/user/deps/code-verification (see Arm/apc/check.sh)
[[require]]
name = "arm64"
path = "../../../deps/code-verification/arm64-semantics/Arm64"
