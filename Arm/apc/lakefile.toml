name = "apc"
defaultTargets = ["Apc"]

# our own interface files, taken from the repo root (unchanged)
[[lean_lib]]
name = "Spec"
srcDir = "../.."
globs = ["Spec.Code", "Spec.ArrCode", "Spec.Encode", "Spec.Tree"]

[[lean_lib]]
name = "Compiler"
srcDir = "../.."
globs = ["Compiler.Iface", "Compiler.Logic", "Compiler.Exp", "Compiler.Stmt", "Compiler.Mem", "Compiler.Arr",
  "Compiler.BLang", "Compiler.CLang"]

# middle files with the `writable` hypotheses on the frame / 8-byte store laws: copies of the repo-root files
# with `mid.patch` applied, staged by `stage.sh` into Mid/ (not committed)
[[lean_lib]]
name = "CompilerW"
srcDir = "Mid"
globs = ["Compiler.Frame", "Compiler.BExp", "Compiler.BStmt", "Compiler.Call", "Compiler.CStmt", "Compiler.CProg"]

[[lean_lib]]
name = "Apc"
globs = ["Apc.+"]

# google-deepmind/code-verification at b0f729a (Apache-2.0), cloned next to the repo, NOT vendored:
# /home/user/deps/code-verification (see Arm/apc/check.sh)
[[require]]
name = "arm64"
path = "../../../deps/code-verification/arm64-semantics/Arm64"
