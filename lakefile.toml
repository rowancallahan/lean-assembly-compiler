name = "proven"
defaultTargets = ["Chain434"]
moreLeanArgs = ["--tstack=400000", "--threads=2"]

# Module names follow the folders; no lib root files (globs only).
[[lean_lib]]
name = "Spec"
globs = ["Spec.+"]

[[lean_lib]]
name = "Compiler"
globs = ["Compiler.+"]

[[lean_lib]]
name = "Riscv"
globs = ["Riscv.Steps.+", "Riscv.Direct.+", "Riscv.Back.+", "Riscv.Examples.+"]

# superseded, does not build (sorry / kernel deep recursion); not a default target
[[lean_lib]]
name = "RiscvLegacy"
globs = ["Riscv.Legacy.+"]

# the AArch64 code generator (Lean 4.29 side; its proofs are in Arm/proofs, Lean 4.34)
[[lean_lib]]
name = "Arm"
globs = ["Arm.CompilerArm"]

[[require]]
name = "Lean_RV64D"
path = "../deps/sail-riscv-lean"

# front end for ordinary recursive definitions (notes in Testing/notes/frontx)
[[lean_lib]]
name = "Frontx"
globs = ["Riscv.Frontx.+"]

# nano: UTF-8 source text -> RISC-V, tiny self-hostable compiler (notes in Testing/notes/NANO.md)
[[lean_lib]]
name = "Nano"
globs = ["Nano.+"]


# lean-4.34 (Lean 4.34.1): the default build is the machine-independent chain WITHOUT the RISC-V Sail model, which is
# not built on this branch (Testing/notes/BRANCHES.md). Roots = every Nano/V2Self module whose import closure does not
# reach LeanRV64D, minus Nano/V2Self/Legacy (the old compiler chain: not part of the proof; it pulls in old Nano modules
# Nano.V2S.Asm / Nano.ElabBProof that are not ported to 4.34). Generated; exclusions in BRANCHES.md, files untouched.
