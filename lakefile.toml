name = "proven"
defaultTargets = ["Spec", "NanoBase", "NanoSelf", "Arm"]  # everything live; Legacy is not built
moreLeanArgs = ["--tstack=400000", "--threads=2"]

# Module names follow the folders; no lib root files (globs only).
[[lean_lib]]
name = "Spec"
# Spec/ARM/* import the ARM models, which this project does not have; Arm/sail and Arm/apc build them
globs = ["Spec.Alloc", "Spec.ArrCode", "Spec.Code", "Spec.Encode", "Spec.Implements1", "Spec.Loader", "Spec.Machines", "Spec.Riscv", "Spec.RiscvMachine", "Spec.Top", "Spec.Tree", "Spec.Ty"]

# the self-hosted nano compiler C (Nano/{Lexer,Parser,Ownership,Codegen,Run,SelfHost,Main,Tests}: source and proof together per stage, Main/REVIEW.lean): THE compiler of this repo
[[lean_lib]]
name = "NanoSelf"
globs = ["Nano.Lexer.+", "Nano.Parser.+", "Nano.Ownership.+", "Nano.Codegen.+", "Nano.Run.+", "Nano.SelfHost.+", "Nano.Main.+", "Nano.Tests.+"]

# support it builds on (moved 2026-11-20 from Compiler/, Riscv/, Nano/V2/; module = path): memory/Hoare logic, Opt,
# the RISC-V step lemmas, the nano V2 language/semantics/encoder
[[lean_lib]]
name = "NanoBase"
globs = ["Nano.Base.+"]

# the AArch64 code generator (its proofs are in Arm/proofs, Arm/apc, Arm/sail)
[[lean_lib]]
name = "Arm"
globs = ["Arm.CompilerArm"]

[[require]]
name = "Lean_RV64D"
path = "../deps/sail-riscv-lean"

# all of Nano (= NanoSelf + NanoBase), for `lake build Nano.<module>`
[[lean_lib]]
name = "Nano"
globs = ["Nano.+"]

# Legacy/: earlier compilers and chains (old Compiler/, Riscv/, Nano/ modules, Legacy/Nano/V2Self/Legacy), mirroring their old
# layout. REFERENCE ONLY, NOT BUILT: not a default target, and nothing live imports it.
[[lean_lib]]
name = "Legacy"
globs = ["Legacy.+"]

# lean-4.34 (Lean 4.34.1): the default build is the machine-independent chain WITHOUT the RISC-V Sail model, which is
# not built on this branch (Testing/notes/BRANCHES.md). Roots = every stage-folder module whose import closure does not
# reach LeanRV64D, (Legacy/ is not a root; the old compiler chain: not part of the proof; it pulls in old Nano modules
# Legacy.Nano.V2S.Asm / Legacy.Nano.ElabBProof that are not ported to 4.34). Generated; exclusions in BRANCHES.md, files untouched.
